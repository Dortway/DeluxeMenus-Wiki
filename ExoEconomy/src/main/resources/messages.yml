help:
  player:
    - "&#DA94E3ExoEconomy &8- &7Shards rewards, selling and boosters"
    - "&f/sell &8- &7sell plain vanilla items for money"
    - "&f/shardnotify [chat|actionbar|sound] [on|off] &8- &7turn reward messages on or off"
    - "&f/sell claim &8- &7collect items returned while your inventory was full"
    - "&f/boosters &8- &7buy boosters and see active ones"
    - "&f/%label% info &8- &7plugin status"
    - "&7Balances, payments: use ExcellentEconomy's currency commands."
  admin:
    - "&f/%label% reload &8- &7reload configuration (currency id and storage need a restart)"
    - "&f/%label% booster list [player|global] &8| give <player|global> <tier> &8| givecustom <player|global> <activity> <mult> <duration> &8| cancel <id> [refund]"
    - "&f/%label% tx list [uncertain|all] [player] &8| inspect <id> &8| resolve <id> <action> confirm"
    - "&f/%label% claims list [player] [review] &8| approve <id> &8| discard <id> confirm"
    - "&f/%label% audit &8- &7check prices against recipes"
    - "&f/%label% storage &8- &7retry storage after a failure"


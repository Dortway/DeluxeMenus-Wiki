# Shard boosters, bought in /boosters with ExcellentEconomy Shards.
#
# A booster multiplies the BASE activity reward (mining, farming, slaying, custom activities).
# It never multiplies transfers, refunds, admin balance changes or selling payouts. Selling is
# only boosted by tiers with "activity: selling" while config.yml selling.boosters.enabled is true.
#
# Purchases activate IMMEDIATELY, unless the rules below say to extend or queue:
#   same-tier:    what buying a tier that is already running for you (or globally) does
#                 EXTEND (add the duration, capped by max-remaining-duration) | QUEUE | STACK | REJECT
#   overlapping:  what buying a different booster covering an overlapping activity does
#                 STACK (both run; multipliers combine) | QUEUE (starts when the other ends) | REJECT
# Queued boosters keep their full duration and start automatically.
#
# Time: boosters store expiry timestamps.
#   personal-offline-time: CONTINUE (time runs while the owner is offline) | PAUSE (freezes)
#   server-offline-time:   CONTINUE (time runs while the server is stopped) | PAUSE (freezes on a
#                          clean shutdown; a crash cannot pause, so crash downtime always counts)
rules:
  same-tier: EXTEND
  overlapping: STACK
  max-active-per-owner: 3        # the global pool counts as one owner
  max-queued-per-owner: 3
  max-remaining-duration: 6h
  # ADDITIVE: 1 + sum(m - 1) (1.5x + 2x = 2.5x) | MULTIPLICATIVE (= 3x) | HIGHEST (= 2x)
  combine: ADDITIVE
  # Hard cap on the combined booster multiplier (personal and global together).
  max-total-multiplier: 4.0
  personal-offline-time: CONTINUE
  server-offline-time: CONTINUE

announcements:
  global-activated: true
  global-expired: true
  personal-activated: true
  personal-expired: true

menu:
  title: "&8✦ &#7FE3FFShard Boosters"
  size: 54
  filler: BLACK_STAINED_GLASS_PANE
  info-slot: 4
  active-slot: 49
  close-slot: 53
  confirm:
    title: "&8Confirm booster purchase"
    confirm-slot: 11
    summary-slot: 13
    cancel-slot: 15


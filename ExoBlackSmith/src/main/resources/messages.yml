# Messages (MiniMessage). {placeholders} are filled by the plugin; runtime values such as player names are
# escaped, so they can never inject formatting. {sym:name} uses the symbols from config.yml.
# Set any message to "" to silence it.

prefix: "<#FFB347>{sym:anvil}</#FFB347> <dark_gray>»</dark_gray> "

# ---------------------------------------------------------------- general / commands
no-permission: "{prefix}<red>you don't have permission to do that."
player-only: "{prefix}<red>only players can do that."
player-not-found: "{prefix}<red>no online player matches <white>{player}</white>."
unknown-item: "{prefix}<red>unknown item id <white>{item}</white>. use <white>/exoblacksmith list</white>."
invalid-amount: "{prefix}<red>amount must be a whole number from 1 to {max}."
invalid-tier: "{prefix}<red>{item} only has tiers/levels 1 to {max}."
given: "{prefix}<gray>gave <white>{amount}× {item}</white> to <white>{player}</white>."
received: "{prefix}<gray>you received <white>{amount}× {item}</white>."
inventory-overflow: "{prefix}<yellow>your inventory was full; {amount} item(s) were dropped at your feet."
reload-success: "{prefix}<#6BD66B>configuration reloaded</#6BD66B> <dark_gray>({warnings} warning(s))"
reload-failed: "{prefix}<red>reload rejected: {errors} error(s). the previous configuration is still active."
drop-granted: "{prefix}<gray>rolled {deaths} {mob} kill(s) for <white>{player}</white>: <white>{amount}</white> head(s)."
usage-admin: "{prefix}<gray>/exoblacksmith <white>give | givehead | drop | reload | validate | list | inspect</white>"
usage-give: "{prefix}<gray>/exoblacksmith give <white><player> <item_id> [amount] [tier]</white>"
usage-givehead: "{prefix}<gray>/exoblacksmith givehead <white><player> <head_id> [amount]</white>"
usage-drop: "{prefix}<gray>/exoblacksmith drop <white><player> <mob> [deaths] [natural|spawner]</white>"
inspect-none: "{prefix}<gray>that is not an exoblacksmith item."
retired-item: "{prefix}<red>this item carries exoblacksmith data that failed verification (edited or counterfeit)."
inspect: "{prefix}<gray>id <white>{id}</white> · kind <white>{kind}</white> · level <white>{level}</white><newline><gray>uid <white>{uid}</white> · runes <white>{runes}</white><newline><gray>status: <white>{valid}</white>"

# ---------------------------------------------------------------- crafting
craft-success: "{prefix}<#6BD66B>{sym:check} forged <white>{amount}× {item}</white>."
craft-missing: "{prefix}<red>{sym:cross} missing for {item}: <white>{missing}</white>."
craft-no-space: "{prefix}<red>{sym:cross} free some inventory space before forging {item}. nothing was used."
craft-recipe-changed: "{prefix}<yellow>this recipe was changed by a reload. check the updated recipe and confirm again."
craft-busy: "{prefix}<gray>please wait..."
craft-no-permission: "{prefix}<red>you can't forge this yet."
transformation-blocked: "<red>exoblacksmith items can't be modified here."

# ---------------------------------------------------------------- runes
rune-applied: "{prefix}<#6BD66B>{sym:check} socketed <white>{rune}</white>."
rune-incompatible: "{prefix}<red>{rune} only fits {slot}."
rune-no-slots: "{prefix}<red>that armor already has three runes."
rune-duplicate: "{prefix}<red>that armor already holds a {rune}."
rune-not-armor: "{prefix}<red>runes only fit exoblacksmith armor."
rune-item-missing: "{prefix}<red>the armor or rune is no longer in your inventory."

# ---------------------------------------------------------------- abilities (action bar)
on-cooldown: "<gray>ready in <white>{time}</white>"
ability-ready: "<#6BD66B>ability ready"
heal-used: "<#FF5C8A>{sym:star} healed {hearts} hearts"
heal-full-health: "<gray>you're already at full health"
cobweb-used: "<gray>{sym:star} spun {count} web(s)"
cobweb-no-target: "<gray>aim at open ground within range"
summon-used: "<gray>{sym:star} {count} ally(s) hunt <white>{player}</white>"
summon-no-target: "<gray>look at an enemy player within range"
summon-pvp-disabled: "<red>pvp is disabled here"
teleport-armed: "<gray>{sym:star} arrow marked"
teleport-success: "<#6BD66B>{sym:arrow} teleported"
teleport-failed: "<red>no safe landing spot · ready in {time}"
explosive-hit: "<#FFB347>{sym:star} +{damage} explosive damage"
totem-surge: "<#B05CFF>{sym:star} totem surge · {seconds} unseen"
set-ability-used: "<#B05CFF>{sym:star} {ability} · {duration}"
set-ability-incomplete: "<gray>wear the full set to use its ability"
tidal-breath: "<#4AA8FF>{sym:star} tidal breath · {seconds}"

# ---------------------------------------------------------------- item presentation (trusted config values)
item-name: "<color:{rarity_hex}>{name}"
lore-rarity: "<color:{rarity_hex}>{rarity_symbol} {rarity}</color> <dark_gray>·</dark_gray> <gray>{level_label} {level}"
lore-rarity-nolevel: "<color:{rarity_hex}>{rarity_symbol} {rarity}"
lore-level-label: "level"
lore-tier-label: "tier"
lore-section-effects: "<#C9C9C9>effects"
lore-reduction: "<dark_gray>{sym:bullet}</dark_gray> <white>-{value}</white> <gray>{category} damage"
lore-speed: "<dark_gray>{sym:bullet}</dark_gray> <white>+{value}</white> <gray>walking speed"
lore-potion: "<dark_gray>{sym:bullet}</dark_gray> <white>{effect} {amplifier}"
lore-hearts: "<dark_gray>{sym:bullet}</dark_gray> <white>+{value}</white> <gray>max hearts"
lore-trident: "<dark_gray>{sym:bullet}</dark_gray> <white>+{value}</white> <gray>trident damage"
lore-cooldown: "<dark_gray>cooldown {value}"
lore-equip: "<dark_gray>equip: {slot}"
lore-mask-slot: "helmet slot"
lore-upgradable: "<dark_gray>upgradable with its mask totem (max level {max_level})"
lore-mask-activation: "<dark_gray>activate: sneak + right-click"
lore-mask-arrow-activation: "<dark_gray>activate: sneak while firing a bow"
lore-rune-fits: "<dark_gray>fits: {slot}"
lore-rune-slot-empty: "<dark_gray>+ rune slot: <gray>empty"
lore-rune-slot-filled: "<dark_gray>+ rune slot: <color:{rarity_hex}>{rune} {tier}"
lore-set: "<#C9C9C9>set: <white>{set}</white> <dark_gray>({slots})"
lore-set-ability: "<#C9C9C9>ability: <white>{ability}</white> <dark_gray>· sneak + swap hands · {cooldown}"

category-all: "all"
category-crystal-anchor: "crystal & anchor"
category-explosion: "explosion"
category-critical-melee: "critical melee"
category-mace-smash: "mace smash"
category-elytra-collision: "elytra collision"

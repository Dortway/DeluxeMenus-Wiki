# ExoQuests menu layouts. Slots are 0-based (row * 9 + column). Text uses MiniMessage with the same theme
# tags as messages.yml. Menus are identified internally, never by title, so titles are free to change.

quests:
  # <player>
  title: "<primary>daily quests"
  rows: 3
  # Exactly three slots, one per daily quest.
  quest-slots: [11, 13, 15]
  quest-item:
    # <quest> <category> <category_icon> <category_color>..</category_color> <objective> <progress>
    # <target> <percent> <bar> <reward> <status>
    name: "<category_color><category_icon></category_color> <text><quest>"
    lore:
      - "<category_color><category></category_color>"
      - ""
      - "<text><objective>"
      - ""
      - "<bar> <muted><percent>%"
      - "<text><progress> <muted>/ <target>"
      - ""
      - "<muted>reward <accent><icon:points> <reward> points"
      - "<status>"
    status-complete: "<success><icon:check> completed"
    status-in-progress: "<warning><icon:dot> in progress"
    status-not-started: "<muted><icon:dot> not started"
    status-unavailable: "<error><icon:cross> this quest was removed from the pool"
    loading-name: "<muted>loading..."
    glint-when-complete: true
    # Optional material for completed quests (empty keeps the quest icon).
    completed-material: ""
    unavailable-material: BARRIER
  info-button:
    slot: 4
    # PLAYER_HEAD shows the viewer's head.
    material: PLAYER_HEAD
    name: "<primary><player>"
    # <balance> <completed> <reset_in>
    lore:
      - "<muted>quest points <accent><icon:points> <balance>"
      - "<muted>completed today <text><completed>/3"
      - ""
      - "<muted><icon:clock> resets in <text><reset_in>"
      - "<muted>points never expire"
  shop-button:
    slot: 22
    material: EMERALD
    name: "<accent><icon:shop> quest shop"
    lore:
      - "<muted>spend your quest points"
      - "<muted>balance <accent><icon:points> <balance>"
      - ""
      - "<text>click to open"
  close-button:
    slot: 26
    material: BARRIER
    name: "<error>close"
    lore: []
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE

shop:
  # <page> <pages>
  title: "<primary>quest shop <muted><page>/<pages>"
  rows: 6
  item-slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34, 37, 38, 39, 40, 41, 42, 43]
  # Appended below each reward's own lore. <price> <balance> <missing> <status> <amount>
  entry-lore:
    - ""
    - "<muted>price <accent><icon:points> <price> points"
    - "<status>"
  status-affordable: "<success>click to buy"
  status-expensive: "<error>you need <missing> more points"
  status-locked: "<error><icon:lock> locked"
  empty-name: "<muted>no rewards yet"
  previous-button:
    slot: 45
    material: ARROW
    name: "<text><icon:arrow> previous page"
    lore: []
  back-button:
    slot: 48
    material: BOOK
    name: "<text>back to quests"
    lore: []
  balance-button:
    slot: 49
    material: SUNFLOWER
    name: "<accent><icon:points> <balance> points"
    lore:
      - "<muted>earn more by completing daily quests"
  close-button:
    slot: 50
    material: BARRIER
    name: "<error>close"
    lore: []
  next-button:
    slot: 53
    material: ARROW
    name: "<text>next page <icon:arrow>"
    lore: []
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE

confirm:
  # <item> <price>
  title: "<primary>confirm purchase"
  rows: 3
  preview-slot: 13
  confirm-button:
    slot: 11
    material: LIME_CONCRETE
    name: "<success><icon:check> buy for <price> points"
    # <price> <balance> <after>
    lore:
      - "<muted>balance <text><balance>"
      - "<muted>after purchase <text><after>"
  cancel-button:
    slot: 15
    material: RED_CONCRETE
    name: "<error><icon:cross> cancel"
    lore:
      - "<muted>back to the shop"
  filler:
    enabled: true
    material: GRAY_STAINED_GLASS_PANE

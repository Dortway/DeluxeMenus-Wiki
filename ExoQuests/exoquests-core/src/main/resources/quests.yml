# ExoQuests quest pool.
#
# Every quest has a stable id (the key, lowercase a-z 0-9 _). Changing an id makes it a different quest.
#   enabled      false removes the quest from future daily rolls (already-assigned quests keep working)
#   category     one of the categories below
#   type         tracking type:
#                  BLOCK_BREAK            blocks broken (materials); natural-only skips player-placed blocks
#                  CROP_HARVEST           fully grown crops broken (materials: WHEAT, CARROTS, POTATOES, BEETROOTS, NETHER_WART)
#                  STACKED_PLANT_HARVEST  sugar cane / cactus / bamboo segments, including the column above
#                  ENTITY_BREED           babies bred by the player (entities)
#                  ENTITY_KILL            kills credited to the player (entities)
#                  TREE_GROW              player-planted saplings growing into trees (trees: OAK, SPRUCE, BIRCH,
#                                         JUNGLE, ACACIA, DARK_OAK, CHERRY, MANGROVE, PALE_OAK)
#                  FISH_CATCH             fishing catches (materials; empty = any catch)
#                  CRAFT_ITEM             items taken from a crafting result (materials)
#                  SMELT_EXTRACT          items taken from furnace/smoker/blast furnace output (materials)
#                  SHEAR_ENTITY           entities sheared (entities)
#                  COLLECT_LAID_EGGS      chicken-laid eggs picked up (materials)
#   target       amount required (1 - 1,000,000)
#   reward       quest points awarded once on completion
#   icon         item shown in the menu
#   weight       relative chance of being rolled (1 - 10000)
#   name / description   menu text (lowercase); {target} is replaced with the formatted target
#
# The target and reward are copied into a player's assignment when it is rolled, so editing them
# affects the next daily roll, not quests already assigned today.


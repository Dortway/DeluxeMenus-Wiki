# ExoDailySpinner messages (MiniMessage). A value may be a single line or a list of lines.
# <prefix> inserts the prefix below. Theme tags: <primary> <secondary> <accent> <muted> <body> <success> <danger>

prefix: "<dark_gray>[<gradient:#22D3EE:#A855F7><sc>Spinner</sc></gradient><dark_gray>]</dark_gray>"

# Short labels used inside other texts
status-ready: "Ready"
source-daily: "<primary>daily spin"
source-bonus: "<secondary>bonus spin"
type-item: "Item"
type-command: "Perk"

# ---- Player
no-permission: "<prefix> <danger>You don't have permission to do that."
players-only: "<prefix> <danger>Only players can use this."
slow-down: "<prefix> <muted>Slow down a little."
unknown-command: "<prefix> <danger>Unknown sub-command. <muted>Try <primary>/<label> help"
usage: "<prefix> <muted>Usage: <primary><usage>"
error-generic: "<prefix> <danger>Something went wrong. Nothing was consumed; please try again."
operation-busy: "<prefix> <accent><sym:hourglass> <body>Your spin or claim is still being processed."
no-rewards: "<prefix> <danger>The spinner has no rewards right now. Please tell a staff member."
spin-not-ready:
  - "<prefix> <muted><sym:hourglass> <body>Your next free spin is ready in <primary><time></primary>."
spin-resumed: "<prefix> <primary><sym:arrow> <body>Resuming your unfinished spin — same reward, no reroll."
spin-resuming: "<prefix> <primary><sym:arrow> <body>Completing your interrupted spin…"
spin-result:
  - ""
  - "  <gradient:#22D3EE:#A855F7><sym:star> <sc>Daily Spinner</sc> <sym:star></gradient>"
  - "  <body>You won <white><reward></white> <muted>x<amount></muted> <dark_gray>(<rarity><dark_gray>)"
  - "  <muted>Used your <source><muted>."
  - ""
spin-result-stored: "<prefix> <accent><sym:gift> <body>Your inventory was full: <accent><stored></accent> item(s) were stored safely. Use <primary>/ds claim</primary>."
delivery-failed: "<prefix> <danger>Your reward could not be delivered. It was logged for staff to restore."
result-title: "<gradient:#FBBF24:#A855F7><sym:star> <sc>You Won</sc> <sym:star></gradient>"
result-subtitle: "<reward> <muted>x<amount>"
announce: "<prefix> <accent><player></accent> <body>won <white><reward></white> <muted>x<amount></muted> <dark_gray>(<rarity><dark_gray>) <body>from the daily spinner!"
claim-none: "<prefix> <muted>You have no stored rewards."
claim-success: "<prefix> <success><sym:check> <body>Claimed <success><count></success> stored item(s)."
claim-partial: "<prefix> <accent><sym:gift> <body><accent><left></accent> item(s) still did not fit and remain stored. Free some space and use <primary>/ds claim</primary>."
pending-reminder: "<prefix> <accent><sym:gift> <body>You have <accent><count></accent> stored reward(s). Use <primary>/ds claim</primary>."
bonus-received: "<prefix> <secondary><sym:star> <body>You received <secondary><amount></secondary> bonus spin(s)! Balance: <secondary><bonus></secondary>"

help:
  - "<gradient:#22D3EE:#A855F7><sc>Daily Spinner</sc></gradient>"
  - " <primary>/ds</primary> <dark_gray>- <muted>open the spinner"
  - " <primary>/ds preview</primary> <dark_gray>- <muted>see all rewards and chances"
  - " <primary>/ds claim</primary> <dark_gray>- <muted>collect stored rewards"
help-admin:
  - "<gradient:#22D3EE:#A855F7><sc>Daily Spinner</sc></gradient> <danger><sc>Admin</sc>"
  - " <primary>/ds</primary> <muted>| <primary>/ds preview</primary> <muted>| <primary>/ds claim</primary>"
  - " <primary>/ds admin</primary> <dark_gray>- <muted>reward management menu"
  - " <primary>/ds reward</primary> <body>addhand|additem|addcommand|remove|list|setweight|setrarity"
  - " <primary>/ds reset <player></primary> <dark_gray>- <muted>reset daily cooldown"
  - " <primary>/ds give <player> <amount></primary> <dark_gray>- <muted>grant bonus spins"
  - " <primary>/ds reload</primary> <dark_gray>- <muted>reload and validate configuration"
  - " <primary>/ds reconcile</primary> <dark_gray>- <muted>review interrupted deliveries"
help-reward:
  - "<prefix> <muted>Reward commands:"
  - " <primary>/ds reward addhand <id> <weight>"
  - " <primary>/ds reward additem <id> <material> <amount> <weight>"
  - " <primary>/ds reward addcommand <id> <weight> <command...> <muted>({player}, {uuid})"
  - " <primary>/ds reward remove <id>"
  - " <primary>/ds reward list"
  - " <primary>/ds reward setweight <id> <weight>"
  - " <primary>/ds reward setrarity <id> <rarity>"
  - " <muted>Weights are relative: chance = weight ÷ total weight."

# ---- Admin
player-unknown: "<prefix> <danger>Player '<player>' has never joined this server."
reward-unknown: "<prefix> <danger>No reward with id '<id>'."
admin-reset: "<prefix> <success><sym:check> <body>Reset the daily cooldown of <primary><player></primary>."
admin-give: "<prefix> <success><sym:check> <body>Gave <secondary><amount></secondary> bonus spin(s) to <primary><player></primary> <muted>(now <bonus>)."
admin-give-cap: "<prefix> <danger>That would exceed the maximum of <max> bonus spins."
admin-invalid-amount: "<prefix> <danger>Amount must be a whole number between 1 and <max>."
admin-invalid-weight: "<prefix> <danger>Invalid weight: <reason>. <muted>Weights are positive relative numbers."
admin-invalid-id: "<prefix> <danger>Reward ids must be 1-32 characters: lowercase letters, digits, - or _."
admin-duplicate-id: "<prefix> <danger>A reward with id '<id>' already exists."
admin-invalid-material: "<prefix> <danger>'<material>' is not a valid item material."
admin-invalid-command: "<prefix> <danger>Invalid command: <reason>"
admin-unknown-rarity: "<prefix> <danger>Unknown rarity '<rarity>'. Available: <rarities>"
admin-hand-empty: "<prefix> <danger>Hold the item you want to add in your main hand."
admin-hand-invalid: "<prefix> <danger>That item cannot be added as a reward."
admin-edit-failed: "<prefix> <danger>Change rejected: <reason>"
admin-reward-added: "<prefix> <success><sym:check> <body>Added reward <primary><id></primary> with weight <accent><weight></accent>. <muted>(your item was copied, not taken)"
admin-reward-removed: "<prefix> <success><sym:check> <body>Removed reward <primary><id></primary>."
admin-weight-set: "<prefix> <success><sym:check> <body>Weight of <primary><id></primary> is now <accent><weight></accent>."
admin-rarity-set: "<prefix> <success><sym:check> <body>Rarity of <primary><id></primary> is now <accent><rarity></accent>."
admin-weight-min: "<prefix> <danger>Weight cannot go below 1 here. Use /ds reward setweight for fractional weights."
admin-confirm-remove: "<prefix> <accent>Press the drop key again within 5 seconds to remove <primary><id></primary>."
admin-list-header: "<prefix> <body><count> reward(s), total weight <accent><total_weight></accent> <muted>(chance = weight ÷ total)"
admin-list-entry: " <dark_gray><sym:dot> <primary><id></primary> <muted>weight</muted> <accent><weight></accent> <muted>(<chance>)</muted> <dark_gray>|</dark_gray> <rarity> <dark_gray>|</dark_gray> <body><type>"
reload-success: "<prefix> <success><sym:check> <body>Configuration reloaded: <primary><rewards></primary> reward(s), <muted><warnings> warning(s)."
reload-failed: "<prefix> <danger>Reload rejected — the previous configuration is still active. Errors:"
reload-in-progress: "<prefix> <muted>A reload is already in progress."
reload-restart-needed: "<prefix> <accent>Database settings changed; restart the server to apply them."
reconcile-header: "<prefix> <body><count> delivery(ies) need review <muted>(regrant re-queues items or re-runs commands)"
reconcile-entry: " <dark_gray><sym:dot> <primary><key></primary> <body><player> <muted><reward> <kind> <danger><status></danger> <muted><time> — <detail>"
reconcile-not-found: "<prefix> <danger>No open reconciliation entry '<key>'."
reconcile-dismissed: "<prefix> <success><sym:check> <body>Dismissed <primary><key></primary>."
reconcile-regranted: "<prefix> <success><sym:check> <body>Regranted <primary><key></primary>. Item rewards wait in the player's /ds claim."
reconcile-manual: "<prefix> <accent>Player name unavailable; run manually: <body><commands>"

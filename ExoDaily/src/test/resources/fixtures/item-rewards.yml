# ═══════════════════════════════════════════════════════════════════ pools
# description: shown in future-day previews ("possible rewards").
# fallback:    pool tried when this one has no eligible entry left.
# entries:     reward ids, or { reward: id, weight: n } to override the weight.
pools:
  standard_common:
    description: "everyday resources"
    entries: [iron_16, coal_32, copper_32, redstone_24, lapis_16, gold_8, torches_32, arrows_32]

  standard_food:
    description: "hearty food"
    fallback: standard_common
    entries: [bread_16, steak_12, baked_potato_16, golden_carrot_8, pumpkin_pie_8]

  standard_building:
    description: "building blocks"
    fallback: standard_common
    entries: [oak_logs_32, stone_bricks_64, glass_32, deepslate_64, bookshelves_4, lanterns_8]

  standard_uncommon:
    description: "rarer finds"
    fallback: standard_common
    entries: [diamonds_3, emeralds_8, xp_bottles_16, ender_pearls_4, golden_apple_1]

  premium_common:
    description: "premium resources"
    fallback: standard_uncommon
    entries: [diamonds_4, emeralds_16, golden_apples_2, xp_bottles_24, ender_pearls_8, quartz_32, amethyst_16, name_tag_1]

  premium_uncommon:
    description: "premium rarities"
    fallback: premium_common
    entries: [diamonds_8, emeralds_32, golden_apples_4, blaze_rods_8, shulker_shells_2, saddle_1]

  milestone_standard:
    description: "weekly milestone"
    fallback: standard_uncommon
    entries:
      - diamonds_8
      - golden_apples_4
      - milestone_pickaxe
      - milestone_xp_32

  milestone_premium:
    description: "premium milestone"
    fallback: premium_uncommon
    entries:
      - premium_pickaxe
      - premium_blade
      - netherite_scrap_2
      - totem_1
      - diamonds_16
      - { reward: enchanted_apple_1, weight: 5 }

  finale_standard:
    description: "cycle finale"
    fallback: milestone_standard
    entries: [netherite_ingot_1, diamonds_16, totem_1, enchanted_apple_1]

  finale_premium:
    description: "premium cycle finale"
    fallback: milestone_premium
    entries: [netherite_ingot_2, diamonds_32, nether_star_1, cycle_crown]

# ════════════════════════════════════════════════════════════════ schedule
# default: pools for any day not listed under days.
# days:    per-day pools. A day may set only some positions; the rest use
#          default. Days beyond cycle-length (config.yml) are ignored.
schedule:
  default:
    position-1: standard_common
    position-2: premium_common
    position-3: premium_common

  days:
    # ── week 1 ──
    1:  { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    2:  { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    3:  { position-1: standard_building,  position-2: premium_common,    position-3: premium_common }
    4:  { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    5:  { position-1: standard_uncommon,  position-2: premium_uncommon,  position-3: premium_common }
    6:  { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    7:  { position-1: milestone_standard, position-2: milestone_premium, position-3: premium_uncommon }
    # ── week 2 ──
    8:  { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    9:  { position-1: standard_building,  position-2: premium_common,    position-3: premium_common }
    10: { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    11: { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    12: { position-1: standard_uncommon,  position-2: premium_uncommon,  position-3: premium_common }
    13: { position-1: standard_building,  position-2: premium_common,    position-3: premium_common }
    14: { position-1: milestone_standard, position-2: milestone_premium, position-3: premium_uncommon }
    # ── week 3 ──
    15: { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    16: { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    17: { position-1: standard_building,  position-2: premium_common,    position-3: premium_common }
    18: { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    19: { position-1: standard_uncommon,  position-2: premium_uncommon,  position-3: premium_common }
    20: { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    21: { position-1: milestone_standard, position-2: milestone_premium, position-3: premium_uncommon }
    # ── week 4 and finale ──
    22: { position-1: standard_building,  position-2: premium_common,    position-3: premium_common }
    23: { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    24: { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    25: { position-1: standard_building,  position-2: premium_common,    position-3: premium_common }
    26: { position-1: standard_uncommon,  position-2: premium_uncommon,  position-3: premium_common }
    27: { position-1: standard_food,      position-2: premium_common,    position-3: premium_common }
    28: { position-1: standard_common,    position-2: premium_common,    position-3: premium_common }
    29: { position-1: standard_uncommon,  position-2: premium_uncommon,  position-3: premium_uncommon }
    30: { position-1: finale_standard,    position-2: finale_premium,    position-3: milestone_premium }

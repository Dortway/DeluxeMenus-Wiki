# ─────────────────────────────────────────────────────────────────────────────
#  ExoDaily · rewards.yml · rewards, weighted pools and the 30-day schedule
#
#  How selection works
#  • The first time a player views a day, all three positions are drawn
#    independently for that player from the pools scheduled for that day and
#    saved. They never change afterwards (reopening, relogging, permission
#    changes, restarts and reloads all keep them).
#  • Each player draws separately, so two players may get the same reward.
#  • The saved copy is what the player sees and receives: editing or removing
#    a reward here never changes a reward that was already assigned.
#
#  Positions: 1 = standard (everyone), 2 and 3 = premium (exodaily.premium).
#  Premium players can claim at most 3 rewards per day in total.
# ─────────────────────────────────────────────────────────────────────────────
config-version: 1

settings:
  # Never give the same reward id twice in one player's day. If a pool runs
  # out of unused entries, its fallback pool is tried, then fallback-pool
  # below; only if every option is used up is a duplicate allowed (logged).
  prevent-duplicates-per-day: true
  # Last-resort pool for any pool that runs out of eligible entries.
  fallback-pool: standard_common
  # How many possible rewards future-day previews list per pool.
  preview-max-entries: 4
  # Days highlighted as milestones in the cycle overview.
  milestone-days: [7, 14, 21, 30]

# ═════════════════════════════════════════════════════════════════ rewards
# id (lowercase letters, digits, _ and -; never rename an id in use):
#   material:          Bukkit material name (required unless serialized-item)
#   amount:            total amount, split into stacks (up to 36 stacks)
#   summary:           short text used in menus, e.g. "16 diamonds"
#   name / lore:       optional MiniMessage display name and lore
#   enchantments:      { enchantment_key: level }   (unsafe levels allowed)
#   flags:             [HIDE_ENCHANTS, ...]          (Bukkit ItemFlag names)
#   custom-model-data: number (applied as the first custom model data float)
#   weight:            default selection weight (pools may override it)
#   serialized-item:   written by /exodaily reward save <id>; the item is
#                      restored exactly (all metadata). Do not edit by hand.
#   type:              item (default), command, or both (item first, then commands)
#   commands:          console commands for type command/both, see below
#
# ── command rewards ──────────────────────────────────────────────────────────
# Commands run from the console, in order, after the claim is reserved. The
# material/name/lore are only the menu icon for type: command, and a summary
# is required. Placeholders:
#   {player} {uuid} {claim_id} {cycle} {day} {position} {reward}
# {claim_id} is unique per player, cycle, day and position. Pass it to plugins
# that can ignore repeated ids so a reward can never be applied twice.
#
# !! Commands are WEAKER than item rewards: they cannot be rolled back and
# !! ExoDaily cannot see what they did. A command that fails, or a crash while
# !! commands run, flags the claim for staff review (/exodaily pending); it is
# !! never re-run automatically. Use commands you trust, ideally idempotent ones.
#
# Example (add the id to a pool to use it):
#   money_500:
#     type: command
#     material: GOLD_NUGGET          # menu icon only
#     summary: "$500"
#     name: "<#FCD34D>$500"
#     lore: ["<#9CA3AF>paid into your balance"]
#     commands:
#       - "eco give {player} 500"
#   crate_key:
#     type: both                     # gives the item, then runs the commands
#     material: TRIPWIRE_HOOK
#     amount: 1
#     summary: "1 crate key"
#     commands:
#       - "broadcast {player} claimed a crate key on day {day}!"

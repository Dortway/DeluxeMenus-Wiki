# ═══════════════════════════════════════════════════════════════════ pools
# description: shown in future-day previews ("possible rewards").
# fallback:    pool tried when this one has no eligible entry left.
# entries:     reward ids, or { reward: id, weight: n } to override the weight.
pools:
  # Position 1 on normal days.
  standard_daily:
    description: "daily rewards"
    entries: [xp_1k, xp_5k, money_20k, money_30k, money_50k, shards_8k, shards_10k,
              vote_key_1, vote_key_2, lantern_box_1, mystic_box_1, rare_key_1, rare_key_2,
              epic_key_1, epic_key_2, prime_key_5]

  # Position 1 on days 7, 14 and 21.
  standard_milestone:
    description: "weekly milestone"
    fallback: standard_daily
    entries: [xp_10k, money_100k, money_200k, shards_20k, vote_key_5, rare_key_5, epic_key_5, prime_key_8, omega_key_1]

  # Position 1 on day 30.
  standard_finale:
    description: "cycle finale"
    fallback: standard_milestone
    entries: [money_1m, shards_50k, omega_key_1, prime_key_8]

  # Positions 2 and 3 on normal days (premium only).
  premium_daily:
    description: "premium rewards"
    fallback: standard_milestone
    entries: [lunar_box_1, lunar_box_5, premium_vote_key_10, premium_epic_key_6,
              lantern_box_10, mystic_box_10, money_5m]

  # Positions 2 and 3 on days 7, 14 and 21 (premium only).
  premium_milestone:
    description: "premium milestone"
    fallback: premium_daily
    entries: [lunar_box_10, premium_omega_key_5, lantern_box_15, mystic_box_15, money_5m, money_10m]

  # Positions 2 and 3 on day 30 (premium only).
  premium_finale:
    description: "premium cycle finale"
    fallback: premium_milestone
    entries: [lunar_box_30, money_10m, premium_omega_key_5, lunar_box_10]

# ════════════════════════════════════════════════════════════════ schedule
# default: pools for any day not listed under days.
# days:    per-day pools. A day may set only some positions; the rest use
#          default. Days beyond cycle-length (config.yml) are ignored.
schedule:
  default:
    position-1: standard_daily
    position-2: premium_daily
    position-3: premium_daily

  days:
    # ── week 1 ──
    1:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }
    2:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }
    3:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }
    4:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }
    5:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }
    6:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }
    7:  { position-1: standard_milestone, position-2: premium_milestone, position-3: premium_milestone }
    # ── week 2 ──
    8:  { position-1: standard_daily,     position-2: premium_daily,     position-3: premium_daily }

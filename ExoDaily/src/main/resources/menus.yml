# ─────────────────────────────────────────────────────────────────────────────
#  ExoDaily · menus.yml · layout and styling of every menu
#
#  Text uses MiniMessage plus <sym:name> and <sc>small caps</sc> (config.yml).
#  Slots are zero-based (0 = top-left). Each menu is validated on load:
#  out-of-range or conflicting slots are reported and the reload is rejected.
#  Empty slots are filled with the border panes (when enabled).
#
#  Items can define "states". A state overrides only the fields it sets
#  (material, name, lore, glow) and inherits the rest from the item.
#
#  Placeholders available in every menu:
#    <day> <cycle> <cycle-length> <cycle-start> <cycle-end> <days-left> <date>
#    <claimed> <max> <available> <reset> <timezone> <tier-name> <progress-bar>
#    <previous-date> <previous-claimed>
#  Special lore lines (must be on a line of their own):
#    <reward-lines>   main.items.today   – one line per claim position
#    <preview-lines>  overview.day-item  – possible rewards of a future day
# ─────────────────────────────────────────────────────────────────────────────
config-version: 1

# ═════════════════════════════════════════════════════════════ main menu (27)
main:
  title: "<#A78BFA><sym:star> <sc>daily rewards</sc>"
  rows: 3            # the main menu is always 27 slots
  border:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    accent-material: PURPLE_STAINED_GLASS_PANE
    accent-slots: [0, 1, 7, 8, 9, 17, 19, 25]
  items:
    progress:
      slot: 4
      material: AMETHYST_SHARD
      name: "<#A78BFA><sym:star> <sc>cycle progress</sc>"
      lore:
        - "<#9CA3AF>day <#F3F4F6><day></#F3F4F6> of <#F3F4F6><cycle-length>"
        - "<progress-bar>"
        - ""
        - "<#9CA3AF>cycle <#F3F4F6><cycle></#F3F4F6> <sym:dot> started <#F3F4F6><cycle-start>"
        - "<#9CA3AF>cycle ends <#F3F4F6><cycle-end>"
        - ""
        - "<#67E8F9><sym:arrow> click to view every day"

    standard-info:
      slot: 11
      material: IRON_INGOT
      name: "<#F3F4F6><sym:diamond> <sc>standard</sc>"
      lore:
        - "<#9CA3AF>available to everyone"
        - ""
        - "<#F3F4F6><sym:dot> up to <#67E8F9>1 reward</#67E8F9> per day"
        - "<#F3F4F6><sym:dot> claim position 1"
      states:
        current:
          lore:
            - "<#9CA3AF>available to everyone"
            - ""
            - "<#F3F4F6><sym:dot> up to <#67E8F9>1 reward</#67E8F9> per day"
            - "<#F3F4F6><sym:dot> claim position 1"
            - ""
            - "<#86EFAC><sym:check> your current tier"
        other:
          lore:
            - "<#9CA3AF>available to everyone"
            - ""
            - "<#F3F4F6><sym:dot> up to <#67E8F9>1 reward</#67E8F9> per day"
            - "<#F3F4F6><sym:dot> claim position 1"
            - ""
            - "<#9CA3AF>included in your premium rewards"

    today:
      slot: 13
      material: CHEST
      name: "<#A78BFA><sym:star> <sc>day <day></sc>"
      lore:
        - "<#9CA3AF>your rewards for today"
        - "<reward-lines>"
        - ""
        - "<#9CA3AF>claimed: <#F3F4F6><claimed>/<max>"
        - "<#9CA3AF>next reset: <#FCD34D><reset>"
        - ""
        - "<footer>"
      states:
        available:
          glow: true
        complete:
          material: BARREL
        complete-locked:
          material: BARREL
        processing:
          material: CLOCK
        review:
          material: CLOCK

    premium-info:
      slot: 15
      material: GOLD_INGOT
      name: "<#FCD34D><sym:star> <sc>premium</sc>"
      lore:
        - "<#9CA3AF>for premium members"
        - ""
        - "<#F3F4F6><sym:dot> up to <#67E8F9>3 rewards</#67E8F9> per day"
        - "<#F3F4F6><sym:dot> standard + positions 2 and 3"
        - "<#9CA3AF>  (3 in total, not 3 extra)"
      states:
        current:
          glow: true
          lore:
            - "<#9CA3AF>for premium members"
            - ""
            - "<#F3F4F6><sym:dot> up to <#67E8F9>3 rewards</#67E8F9> per day"
            - "<#F3F4F6><sym:dot> standard + positions 2 and 3"
            - "<#9CA3AF>  (3 in total, not 3 extra)"
            - ""
            - "<#86EFAC><sym:check> your current tier"
        other:
          lore:
            - "<#9CA3AF>for premium members"
            - ""
            - "<#F3F4F6><sym:dot> up to <#67E8F9>3 rewards</#67E8F9> per day"
            - "<#F3F4F6><sym:dot> standard + positions 2 and 3"
            - "<#9CA3AF>  (3 in total, not 3 extra)"
            - ""
            - "<#FCD34D><sym:arrow> upgrade to unlock positions 2 and 3"
            - "<#9CA3AF>upgrading today unlocks today's too"

    previous-day:
      slot: 18
      material: LIGHT_GRAY_DYE
      name: "<#9CA3AF><sym:dot> <sc>yesterday</sc>"
      lore:
        - "<#9CA3AF>your cycle started today"
        - "<#9CA3AF>day 1 is ready to claim"
      states:
        claimed:
          material: LIME_DYE
          name: "<#86EFAC><sym:check> <sc>yesterday</sc>"
          lore:
            - "<#9CA3AF><previous-date>"
            - "<#F3F4F6>claimed <#86EFAC><previous-claimed></#86EFAC> reward(s)"
        missed:
          material: GRAY_DYE
          name: "<#FCA5A5><sym:cross> <sc>yesterday</sc>"
          lore:
            - "<#9CA3AF><previous-date>"
            - "<#FCA5A5>missed <#9CA3AF>— those rewards were skipped"
            - "<#9CA3AF>missed days can't be claimed later"

    instructions:
      slot: 22
      material: BOOK
      name: "<#67E8F9><sym:hourglass> <sc>how it works</sc>"
      lore:
        - "<#F3F4F6>claim new rewards each calendar day."
        - "<#F3F4F6>standard: up to 1 reward daily."
        - "<#F3F4F6>premium: up to 3 rewards daily."
        - "<#FCD34D>miss a day and its rewards are skipped."
        - "<#9CA3AF>your cycle repeats after day <cycle-length>."
        - "<#9CA3AF>reset timezone: <timezone>"

    countdown:
      slot: 26
      material: CLOCK
      name: "<#FCD34D><sym:hourglass> <sc>next reset</sc>"
      lore:
        - "<#F3F4F6>new rewards in <#FCD34D><reset>"
        - "<#9CA3AF>days change at midnight, <timezone>"
        - "<#9CA3AF>days left this cycle: <#F3F4F6><days-left>"

# ═════════════════════════════════════════════════════ reward details (claim)
details:
  title: "<#A78BFA><sym:star> <sc>day <day> rewards</sc>"
  rows: 3
  border:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    accent-material: PURPLE_STAINED_GLASS_PANE
    accent-slots: [0, 1, 7, 8, 9, 17]
  items:
    header:
      slot: 4
      material: NETHER_STAR
      name: "<#A78BFA><sym:star> <sc>day <day></sc>"
      lore:
        - "<#9CA3AF>claim each position separately"
        - ""
        - "<#9CA3AF>tier: <#F3F4F6><tier-name>"
        - "<#9CA3AF>claimed: <#F3F4F6><claimed>/<max>"
        - "<#9CA3AF>next reset: <#FCD34D><reset>"
    back:
      slot: 18
      material: ARROW
      name: "<#9CA3AF><sym:arrow> <sc>back</sc>"
      lore:
        - "<#9CA3AF>return to the overview"
    countdown:
      slot: 26
      material: CLOCK
      name: "<#FCD34D><sym:hourglass> <sc>next reset</sc>"
      lore:
        - "<#F3F4F6>new rewards in <#FCD34D><reset>"
        - "<#FCD34D>unclaimed rewards are skipped at reset"

  # Each claim position shows the actual assigned reward and a claim button.
  # Clicking either one claims that position.
  positions:
    1: { reward-slot: 11, button-slot: 20 }
    2: { reward-slot: 13, button-slot: 22 }
    3: { reward-slot: 15, button-slot: 24 }

  # Added around the reward's own name and lore. <position> <tier> <reward>
  # and <status-line> are available here.
  reward-item:
    show-reward-lore: true
    lore-before:
      - "<#9CA3AF><sym:diamond> position <position> <sym:dot> <tier>"
      - ""
    lore-after:
      - ""
      - "<status-line>"

  claim-button:
    material: GRAY_STAINED_GLASS_PANE
    name: "<#9CA3AF><sc>position <position></sc>"
    lore: []
    states:
      available:
        material: LIME_STAINED_GLASS_PANE
        glow: true
        name: "<#86EFAC><sym:check> <sc>claim</sc> <#9CA3AF>position <position>"
        lore:
          - "<#F3F4F6><reward>"
          - ""
          - "<#86EFAC><sym:arrow> click to claim"
      claimed:
        material: GREEN_STAINED_GLASS_PANE
        name: "<#86EFAC><sym:check> <sc>claimed</sc>"
        lore:
          - "<#9CA3AF><reward>"
          - "<#9CA3AF>come back tomorrow for more"
      locked:
        material: RED_STAINED_GLASS_PANE
        name: "<#FCA5A5><sym:cross> <sc>premium only</sc>"
        lore:
          - "<#9CA3AF><reward>"
          - ""
          - "<#FCD34D>requires premium"
          - "<#9CA3AF>unlock it before reset to claim it today"
      processing:
        material: YELLOW_STAINED_GLASS_PANE
        name: "<#FCD34D><sym:hourglass> <sc>claiming…</sc>"
      review:
        material: ORANGE_STAINED_GLASS_PANE
        name: "<#FCD34D><sym:hourglass> <sc>under review</sc>"
        lore:
          - "<#9CA3AF>an interrupted delivery is"
          - "<#9CA3AF>being checked by staff"

# ═══════════════════════════════════════════════════════ cycle overview (54)
overview:
  title: "<#A78BFA><sym:star> <sc>cycle <cycle></sc> <#9CA3AF><sym:dot> day <day>/<cycle-length>"
  rows: 6
  border:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    accent-material: PURPLE_STAINED_GLASS_PANE
    accent-slots: [0, 8, 9, 17, 36, 44, 53]
  items:
    header:
      slot: 4
      material: AMETHYST_SHARD
      name: "<#A78BFA><sym:star> <sc>cycle overview</sc>"
      lore:
        - "<progress-bar>"
        - "<#9CA3AF>day <#F3F4F6><day></#F3F4F6> of <cycle-length> <sym:dot> <days-left> left"
        - ""
        - "<#9CA3AF>future days show <#F3F4F6>possible</#F3F4F6> rewards only."
        - "<#9CA3AF>your actual rewards are chosen when the day arrives."
    back:
      slot: 45
      material: ARROW
      name: "<#9CA3AF><sym:arrow> <sc>back</sc>"
      lore:
        - "<#9CA3AF>return to today's rewards"

  # One slot per day, in order (day 1 first). Must have at least cycle-length slots.
  day-slots: [11, 12, 13, 14, 15, 16,
              20, 21, 22, 23, 24, 25,
              29, 30, 31, 32, 33, 34,
              38, 39, 40, 41, 42, 43,
              47, 48, 49, 50, 51, 52]

  # Placeholders: <day-number> <day-date> <day-claimed> (plus the global ones).
  # The stack size shows the day number.
  day-item:
    material: LIGHT_GRAY_DYE
    name: "<#F3F4F6><sym:dot> <sc>day <day-number></sc>"
    lore:
      - "<#9CA3AF><day-date>"
    states:
      claimed:
        material: LIME_DYE
        name: "<#86EFAC><sym:check> <sc>day <day-number></sc>"
        lore:
          - "<#9CA3AF><day-date>"
          - "<#F3F4F6>claimed <#86EFAC><day-claimed></#86EFAC> reward(s)"
      missed:
        material: GRAY_DYE
        name: "<#FCA5A5><sym:cross> <sc>day <day-number></sc>"
        lore:
          - "<#9CA3AF><day-date>"
          - "<#FCA5A5>missed <#9CA3AF>— skipped permanently"
      today:
        material: PURPLE_DYE
        glow: true
        name: "<#A78BFA><sym:star> <sc>day <day-number></sc> <#9CA3AF>(today)"
        lore:
          - "<#9CA3AF><day-date>"
          - "<#9CA3AF>claimed: <#F3F4F6><claimed>/<max>"
          - "<#9CA3AF>next reset: <#FCD34D><reset>"
      future:
        material: LIGHT_GRAY_DYE
        lore:
          - "<#9CA3AF><day-date>"
          - ""
          - "<#9CA3AF>possible rewards:"
          - "<preview-lines>"
          - ""
          - "<#9CA3AF>not guaranteed <sym:dot> chosen when the day arrives"
      milestone:
        material: YELLOW_DYE
        glow: true
        name: "<#FCD34D><sym:star> <sc>day <day-number></sc> <#9CA3AF>(milestone)"
        lore:
          - "<#9CA3AF><day-date>"
          - ""
          - "<#9CA3AF>possible rewards:"
          - "<preview-lines>"
          - ""
          - "<#9CA3AF>not guaranteed <sym:dot> chosen when the day arrives"

# ════════════════════════════════════════════════════════════════════ sounds
# sound: any sound key (namespace:path), or "none" to disable.
# volume: 0.0-10.0, pitch: 0.5-2.0. Played only to the player.
sounds:
  open:    { sound: "minecraft:block.amethyst_block.chime", volume: 0.7, pitch: 1.2 }
  click:   { sound: "minecraft:ui.button.click", volume: 0.3, pitch: 1.6 }
  claim:   { sound: "minecraft:entity.player.levelup", volume: 0.4, pitch: 1.8 }
  error:   { sound: "minecraft:block.note_block.bass", volume: 0.6, pitch: 0.7 }
  locked:  { sound: "minecraft:block.chest.locked", volume: 0.5, pitch: 1.2 }
  refresh: { sound: "minecraft:block.note_block.chime", volume: 0.5, pitch: 1.4 }

# A small particle burst visible only to the claiming player.
claim-effect:
  enabled: true
  particle: HAPPY_VILLAGER    # must be a particle without extra data
  count: 10
  spread: 0.4

# ════════════════════════════════════════════════════════ shared text lines
lines:
  tier-standard: "standard"
  tier-premium: "premium"

  # <reward-lines> in the central item. <tier> <reward> <position>
  reward-line-available: "<#F3F4F6><sym:diamond> <tier>: <#67E8F9><reward>"
  reward-line-claimed: "<#86EFAC><sym:check> <#9CA3AF><tier>: <st><reward></st>"
  reward-line-locked: "<#9CA3AF><sym:cross> <tier>: <reward> <#FCA5A5>(locked)"
  reward-line-processing: "<#FCD34D><sym:hourglass> <#F3F4F6><tier>: <#67E8F9><reward>"
  reward-line-review: "<#FCD34D><sym:hourglass> <#F3F4F6><tier>: <#9CA3AF><reward> (under review)"

  # Last line of the central item, by state.
  today-footer-available: "<#86EFAC><sym:arrow> click to view and claim"
  today-footer-complete: "<#86EFAC><sym:check> all claimed <#9CA3AF>— come back tomorrow"
  today-footer-complete-locked: "<#86EFAC><sym:check> claimed <#9CA3AF><sym:dot> <#FCD34D>premium unlocks 2 more today"
  today-footer-processing: "<#FCD34D><sym:hourglass> claiming…"
  today-footer-review: "<#FCD34D><sym:hourglass> a reward is being checked by staff"

  # <status-line> on reward items in the details menu.
  status-available: "<#86EFAC><sym:arrow> click to claim"
  status-claimed: "<#86EFAC><sym:check> claimed"
  status-locked: "<#FCA5A5><sym:cross> requires premium"
  status-processing: "<#FCD34D><sym:hourglass> claiming…"
  status-review: "<#FCD34D><sym:hourglass> under review by staff"

  # Name used when a reward item has no custom name.
  reward-name: "<#67E8F9><reward>"
  reward-unavailable: "<#FCA5A5><sym:cross> reward unavailable"

  # <preview-lines> for future days. <tier> <description> <reward> <count>
  preview-pool-line: "<#F3F4F6><sym:diamond> <tier>: <#9CA3AF><description>"
  preview-reward-line: "<#9CA3AF>   <sym:dot> <#F3F4F6><reward>"
  preview-more: "<#9CA3AF>   <sym:dot> and <count> more"

  progress-filled: "<#A78BFA><sym:bar>"
  progress-empty: "<#4B5563><sym:bar>"
  under-a-minute: "<1m"
  # java.time pattern for dates in menus (output is lowercased).
  date-format: "d MMM yyyy"
